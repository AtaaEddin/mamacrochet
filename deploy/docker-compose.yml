# hanadicrochet production stack — exactly 4 containers (plan 10).
#
#   cd deploy && docker compose up -d     (or: ./deploy.sh)
#
# All configuration comes from the .env in THIS directory (template:
# .env.example). .env is gitignored — never commit it. Data lives in
# ./data/ (postgres, uploads, caddy TLS) and backups in ./backups/.

name: hanadicrochet

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Internal-only: the port is deliberately NOT published — only the api
    # container (same compose network) can reach it.
    # mem_limit: 512m  # uncomment to hard-cap on a Raspberry Pi

  api:
    build:
      context: ..
      dockerfile: src/Hanadicrochet.Api/Dockerfile
    image: hanadicrochet-api:latest
    restart: unless-stopped
    environment:
      ConnectionStrings__hanadicrochet: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Uploads__Root: /data/uploads
      # Admin bootstrap (auto-seeded admin; empty = generated password,
      # logged once — see README "Admin account").
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:-}
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # /health also reports DB reachability; startup waits for a healthy
    # postgres, and the app applies EF migrations on boot (single instance).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Not published: browsers reach the API through Caddy at /api (same
    # origin → cookie auth works without CORS).

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # Same-origin API path (Caddy strips the /api prefix → api:8085).
        NEXT_PUBLIC_API_URL: /api
        # Full public URL for metadata; empty for plain-HTTP local use.
        NEXT_PUBLIC_SITE_URL: ${MM_SITE_URL:-}
    image: hanadicrochet-web:latest
    restart: unless-stopped
    environment:
      # Server-side catalog fetch base (plan 04 SSR). The web container reaches
      # the api container on the compose network; /api is the browser-facing
      # Caddy route (build-arg NEXT_PUBLIC_API_URL) and is not resolvable
      # from Node.
      API_SERVER_URL: http://api:8085
    healthcheck:
      # / redirects to the locale root; busybox wget follows it.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    # Not published either — only Caddy serves the public port.
    # mem_limit: 512m  # uncomment to hard-cap on a Raspberry Pi

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Site address: plain "http://" for LAN/IP use, or a bare domain
      # (e.g. hanadicrochet.example.com) for automatic Let's Encrypt HTTPS.
      CADDY_SITE: ${CADDY_SITE:-http://}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443" # used only when CADDY_SITE is a real domain
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data # TLS certs + cache (persist across restarts)
    depends_on:
      - api
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 6
